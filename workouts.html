<html lang="en">
<head>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone-first logbook, sticky header, fixed bottom tab bar; widens to a centered 640px column on desktop */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #15202b;
  --muted: #5b6876;
  --line: #d5dce4;
  --accent: #2443c7;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9ff;
  --done: #2443c7;
  --hot: #d9480f;
  --hot-soft: #fff0e8;
  --danger: #c92a2a;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #17202a; --surface-2: #1d2833; --ink: #e6ecf2; --muted: #93a1af;
    --line: #2b3846; --accent: #7f9cff; --accent-ink: #0e141a; --accent-soft: #1f2b52;
    --done: #7f9cff; --hot: #ff8a50; --hot-soft: #3a2218; --danger: #ff6b6b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #17202a; --surface-2: #1d2833; --ink: #e6ecf2; --muted: #93a1af;
  --line: #2b3846; --accent: #7f9cff; --accent-ink: #0e141a; --accent-soft: #1f2b52;
  --done: #7f9cff; --hot: #ff8a50; --hot-soft: #3a2218; --danger: #ff6b6b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: #2f9e44; }
main { display: grid; gap: 14px; }
h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: .01em; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.back { font-weight: 600; font-size: 14px; color: var(--accent); text-decoration: none; white-space: nowrap; }
button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
button.danger { color: var(--danger); }
button.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
button.block { width: 100%; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; min-width: 0; }
input::placeholder { color: var(--muted); opacity: .75; }
form.inline { display: flex; gap: 8px; }
form.inline input { flex: 1; }

/* routine picker */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dn { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); padding-bottom: 2px; }
.day { min-height: 0; aspect-ratio: 1; max-width: 100%; padding: 2px; border-radius: 10px; background: transparent; border: 1.5px solid transparent; display: grid; place-items: center; align-content: center; gap: 0; position: relative; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink); }
.day svg { width: 14px; height: 14px; stroke: var(--accent-ink); }
.day i { font-style: normal; font-size: 11px; line-height: 1; color: var(--danger); font-family: var(--body); }
.day.done { background: var(--accent); color: var(--accent-ink); }
.day.miss { border-color: var(--danger); color: var(--danger); }
.day.plan { border: 1.5px dashed var(--muted); }
.day.today:not(.done) { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--ink); }
.day.sel { outline: 2px solid var(--hot); outline-offset: 1px; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.weekdays button { padding: 0; min-height: 40px; }
.weekdays button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .3; cursor: default; }
.macro { display: grid; gap: 4px; }
.tbtn { min-height: 34px; padding: 4px 10px; font-size: 14px; font-variant-numeric: tabular-nums; border-radius: 99px; }
.tbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tmr { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 12; width: min(608px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.tmr-clock { font-size: 64px; font-weight: 700; text-align: center; line-height: 1; }
.tmr-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tmr-presets button { padding: 6px; min-height: 40px; font-size: 14px; }
.tmr-presets button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.alarm { position: fixed; inset: 0; z-index: 30; background: var(--hot); color: #fff; display: grid; place-items: center; text-align: center; padding: 24px; animation: pulse 1s infinite alternate; }
.alarm > div { display: grid; gap: 14px; justify-items: center; }
.alarm-t { font-family: var(--display); font-size: 56px; font-weight: 700; text-transform: uppercase; }
.alarm-s { font-size: 18px; }
.alarm button { background: #fff; color: var(--hot); border-color: #fff; font-size: 20px; padding: 14px 28px; }
.alarm button.ghost { background: transparent; color: #fff; border-color: transparent; font-size: 16px; }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.15); } }
@media (prefers-reduced-motion: reduce) { .alarm { animation: none; } }
.stair { display: grid; gap: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); }
.stair.done { background: var(--accent-soft); }
.stair.done .check { background: var(--done); border-color: var(--done); }
.stair.done .check svg { stroke: var(--accent-ink); opacity: 1; }
.stair-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stair-grid label { display: grid; gap: 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.stair-grid input { width: 100%; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 600; padding: 6px 4px; }
@media (max-width: 480px) { .stair-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.summary { display: grid; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.grade { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }
.grade.g-great { background: var(--accent); color: var(--accent-ink); }
.grade.g-ok { background: var(--accent-soft); color: var(--accent); }
.grade.g-low { background: var(--hot-soft); color: var(--hot); }
.sumlist { display: grid; gap: 6px; font-size: 14px; }
.sumlist div { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; }
.sumlist.ok span:first-child { color: var(--accent); font-weight: 700; }
.sumlist.no span:first-child { color: var(--hot); font-weight: 800; text-align: center; }
.review { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.review-text { white-space: pre-wrap; line-height: 1.5; }
.est-out { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.est-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
label.btn { display: inline-flex; align-items: center; }
.conf { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.conf.c-high { background: var(--accent-soft); color: var(--accent); }
.conf.c-medium { background: var(--surface-2); color: var(--muted); }
.conf.c-low { background: var(--hot-soft); color: var(--hot); }
.reopen { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--hot-soft); border-radius: 10px; padding: 12px; }
.idea { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
.food.g-dairy { border-left-color: #1c7ed6; }
.food.g-fat { border-left-color: #8c6d46; }
.sm-list { display: grid; gap: 4px; }
.sm-row { display: flex; align-items: center; gap: 4px; }
.sm { flex: 1; display: flex; align-items: center; gap: 12px; text-align: left; background: transparent; border-color: transparent; padding: 6px 4px; font-weight: 500; min-width: 0; }
.sm .box { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.sm .box svg { width: 18px; height: 18px; stroke: var(--accent-ink); }
.sm.on .box { background: var(--done); border-color: var(--done); }
.sm.on:not(.shop) span:last-child { color: var(--muted); text-decoration: line-through; }
.sm.shop.on .box { background: var(--hot); border-color: var(--hot); }
.sm.shop.on span:last-child { font-weight: 700; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wbar { min-height: 0; padding: 4px 0; border: 0; background: transparent; display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
.wbar.sel { color: var(--ink); }
.wcol { width: 100%; max-width: 28px; height: 56px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
.wcol b { display: block; width: 100%; background: var(--accent); }
.wcol b.over { background: var(--hot); }
.wbar.sel .wcol { border-color: var(--ink); }
.chip { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; border: 1.5px dashed var(--muted); color: var(--muted); }
.chip.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.foods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.food { text-align: left; display: grid; gap: 2px; padding: 10px 12px; border-left: 4px solid var(--line); }
.food b { font-size: 15px; }
.food span { font-size: 12px; font-weight: 500; color: var(--muted); }
.food.g-protein { border-left-color: var(--hot); }
.food.g-veg { border-left-color: #2f9e44; }
.food.g-carb { border-left-color: #e0a500; }
.food.g-fruit { border-left-color: #c2255c; }
.food.g-other { border-left-color: var(--accent); }
details summary { cursor: pointer; list-style-position: outside; }
.foodform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.foodform #ff-name, .foodform button { grid-column: 1 / -1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.routine { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
.routine:first-of-type { border-top: 0; padding-top: 0; }
.routine > div { min-width: 0; }
.routine p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

/* active workout */
.wk-head { display: grid; gap: 8px; }
.wk-date { gap: 14px; }
.wk-date label { display: flex; align-items: center; gap: 6px; }
.wk-date input { min-height: 36px; padding: 4px 8px; font-size: 15px; }
.wk-head input { font-family: var(--display); font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; background: transparent; border-color: transparent; padding-inline: 0; width: 100%; }
.wk-head input:hover, .wk-head input:focus { border-color: var(--line); background: var(--surface-2); padding-inline: 10px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter b { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.ex-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.ex-title > div { min-width: 0; }
.last { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 34px minmax(52px, 1fr) minmax(64px, 1.2fr) minmax(56px, 1fr) 48px; gap: 6px; align-items: center; padding: 4px; border-radius: 10px; }
.set.head { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding-block: 0; }
.set.head span:last-child { text-align: center; }
.set .n { font-family: var(--display); font-weight: 700; font-size: 18px; text-align: center; }
.set .prev { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set input { width: 100%; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 600; padding: 6px 4px; font-variant-numeric: tabular-nums; }
.set.done { background: var(--accent-soft); }
.set.done input { background: transparent; border-color: transparent; }
.check { width: 44px; height: 44px; padding: 0; border-radius: 10px; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); }
.check svg { width: 22px; height: 22px; stroke: var(--muted); opacity: .4; }
.set.done .check { background: var(--done); border-color: var(--done); }
.set.done .check svg { stroke: var(--accent-ink); opacity: 1; }
.tag { font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-left: 8px; vertical-align: 3px; }
.pr { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--hot); background: var(--hot-soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

/* history */
.hist { display: grid; gap: 10px; }
.hist-item { cursor: pointer; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.detail { display: grid; gap: 6px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.detail div { display: flex; justify-content: space-between; gap: 10px; }
.detail div span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* progress */
.big { font-family: var(--display); font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 20px; color: var(--muted); margin-left: 4px; }
.delta { font-weight: 600; font-size: 14px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 12px; font-family: var(--body); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .end { fill: var(--accent); }
.chart .endlbl { fill: var(--ink); font-size: 13px; font-weight: 600; font-family: var(--body); }
.empty { text-align: center; padding: 22px 8px; color: var(--muted); font-size: 15px; }
.list { display: grid; }
.list > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; min-height: 40px; padding: 8px 16px; background: var(--surface-2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* nav + timer */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: transparent; border-radius: 0; min-height: 60px; display: grid; justify-items: center; gap: 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 4px; }
nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--accent); }
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 11; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.timer .num { font-size: 24px; font-weight: 700; min-width: 3.2ch; }
.timer button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); min-height: 38px; padding: 6px 12px; border-radius: 99px; font-size: 14px; }
.timer.over { background: var(--hot); color: #fff; }
.timer.over button { color: #fff; border-color: rgba(255,255,255,.5); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 380px) { .set { grid-template-columns: 28px minmax(40px, .8fr) minmax(58px, 1.2fr) minmax(50px, 1fr) 44px; gap: 4px; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="row" style="gap:12px;flex-wrap:nowrap"><a class="back" href="index.html" aria-label="Back to Goal Log">‹ Goal Log</a><h1 class="brand">Lift<span>Log</span></h1></div>
    <div class="row" style="gap:10px;flex-wrap:nowrap"><button class="tbtn" id="tbtn" data-act="tmr-open" aria-label="Timer">⏱ <span id="tbtn-t">Timer</span></button><div class="sync" id="sync"><i></i><span>Loading</span></div></div>
  </header>
  <main id="main"><div class="card empty">Loading your log…</div></main>
</div>
<nav class="tabs"><div>

function chart(points, unit) {
  if (points.length < 2) return `<div class="empty small">Log at least two entries to see the trend.</div>`;
  const W = 600, H = 220, L = 44, R = 64, T = 16, B = 30;
  const xs = points.map((p) => p.x.getTime()), ys = points.map((p) => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max(y1 - y0, 1); const stepRaw = span / 3; const mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= stepRaw) || 10 * mag;
  y0 = Math.floor((y0 - span * 0.1) / step) * step; y1 = Math.ceil((y1 + span * 0.1) / step) * step;
  const sx = (x) => L + ((x - x0) / (x1 - x0)) * (W - L - R);
  const sy = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = "";
  for (let v = y0; v <= y1 + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text class="ax" x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  const pts = points.map((p) => [sx(p.x.getTime()), sy(p.y)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z`;
  const dots = pts.length <= 40 ? pts.slice(0, -1).map((p) => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`).join("") : "";
  const e = pts[pts.length - 1];
  const o = { month: "short", day: "numeric" };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${g}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}
    <circle class="end" cx="${e[0]}" cy="${e[1]}" r="6"/>
    <text class="endlbl" x="${e[0] + 10}" y="${e[1] + 5}">${fmtNum(points[points.length - 1].y)} ${unit}</text>
    <text class="ax" x="${L}" y="${H - 8}">${fmtDate(x0, o)}</text>
    <text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">${fmtDate(x1, o)}</text></svg>`;
}

function bodyweightCard(compact) {

      const d = conv(last.v, last.u, U()) - conv(base.v, base.u, U());

const ROW_PROMPT = (n) => `${n > 1 ? `These ${n} photos all show the same rowing machine console (often a Concept2 PM5) at the same moment, each on a different display page.` : "This is a photo of a rowing machine console (often a Concept2 PM5)."} Read the numbers and combine them.

// Phone photos can be 5 to 15 MB. Shrink them first so reading is faster and the page doesn't run out of memory.
async function shrinkPhoto(file, max = 1600) {
  try {
    if (!file || !/^image\//.test(file.type) || file.size < 900000) return file;
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    c.width = c.height = 0;
    return blob ? new File([blob], (file.name || "photo").replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch (e) { return file; }
}

function calendarCard() {
  const now = new Date(), today = dayKey(now);
  if (!S.cal) S.cal = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = S.cal;
  const byDay = {};
  for (const [id, w] of finished()) { const k = dayKey(new Date(w.startedAt)); (byDay[k] = byDay[k] || []).push([id, w]); }
  const plan = S.profile.plan, since = S.profile.planSince;
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const missed = (k, dow) => plan.includes(dow) && !byDay[k] && k < today && since && k >= since;
  let cells = "", nDone = 0, nMissed = 0;
  for (let i = 0; i < first.getDay(); i++) cells += `<span></span>`;
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), k = dayKey(dt), dow = dt.getDay();
    const done = !!byDay[k], miss = missed(k, dow), planned = plan.includes(dow) && k >= today;
    if (done) nDone++; if (miss) nMissed++;
    const cls = ["day", done ? "done" : "", miss ? "miss" : "", planned && !done ? "plan" : "", k === today ? "today" : "", S.calDay === k ? "sel" : ""].join(" ");
    const lbl = fmtDate(dt, { weekday: "long", month: "long", day: "numeric" }) + (done ? ", workout done" : miss ? ", missed" : planned ? ", workout day" : "");
    cells += `<button class="${cls}" data-act="cal-day" data-k="${k}" aria-label="${lbl}"><span>${d}</span>${done ? CHECK : miss ? '<i aria-hidden="true">✕</i>' : ""}</button>`;
  }
  // this week (Sun to Sat)
  let weekTxt = "";
  if (plan.length) {
    const ws = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
    let doneW = 0;
    for (let i = 0; i < 7; i++) { const k = dayKey(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i)); if (byDay[k]) doneW++; }

function historyView() {

  let month = "";
  const shown = S.histShow || 20;

    if (m !== month) { month = m; h += `<div class="label" style="margin-top:6px">${m}</div>`; }

      ${open ? `<div class="detail">${w.exercises.map((e) => `<div><span>${esc(e.name)}</span><span>${e.sets.filter((s) => s.done).map((s) => isCardio(e) ? cardioTxt(s, w.unit) : `${disp(s.w, w.unit)}×${s.r || "–"}`).join(", ") || "no sets done"}</span></div>`).join("")}</div>

    </section>`;

async function runImport(file) {
  S.importing = true; render();
  try {
    const parsed = JSON.parse(await file.text());
    const docs = (Array.isArray(parsed) ? parsed : parsed.docs || []).filter((d) => d && typeof d.id === "string" && d.data && typeof d.data === "object");
    if (!docs.length) throw new Error("That file has nothing to import.");
    const res = await store.call("lift_import", { docs });
    await store.pull();
    toast(`Imported ${res.count} item${res.count === 1 ? "" : "s"} from Lift Log.`);
  } catch (e) { toast(e && e.message ? e.message : "Couldn't import that file."); }
  S.importing = false; render();
}
function progressView() {
  const names = new Map();
  const cardioKeys = new Set();
  for (const [, w] of finished()) for (const e of w.exercises) if (e.sets.some((s) => s.done && (isCardio(e) ? Number(s.min) > 0 || Number(s.dist) > 0 || Number(s.m) > 0 : s.w !== ""))) { const k = exKey(e.name); if (!names.has(k)) names.set(k, e.name); if (isCardio(e)) cardioKeys.add(k); }
  if (S.progEx && !names.has(S.progEx)) S.progEx = null;
  const sel = S.progEx || names.keys().next().value;
  let ex = `<section class="card"><h3>Exercise progress</h3>`;
  const picker = () => `<select id="prog-ex" data-in="progex" aria-label="Exercise">${[...names].map(([k, n]) => `<option value="${esc(k)}" ${k === sel ? "selected" : ""}>${esc(n)}${cardioKeys.has(k) ? " (cardio)" : ""}</option>`).join("")}</select>`;
  if (!sel) ex += `<div class="empty small">Finish a workout with checked-off sets and each exercise's top weight, or your cardio time and distance, will be charted here.</div>`;
  else if (cardioKeys.has(sel)) {
    const pts = []; let totalMin = 0, totalDist = 0, longest = 0, useDist = false;
    const sessions = [];
    for (const [, w] of [...finished()].reverse()) {
      let m = 0, dd = 0, ft = 0, rm = 0, any = false;
      for (const e of w.exercises) if (exKey(e.name) === sel && isCardio(e)) for (const s of e.sets) if (s.done) { any = true; m += Number(s.min) || 0; dd += convD(s.dist, w.unit, U()) || 0; ft += Number(s.feet) || 0; rm += Number(s.m) || 0; }
      if (any) sessions.push({ x: new Date(w.startedAt), m, dd, ft, rm });
    }
    useDist = sessions.filter((x) => x.dd > 0).length >= sessions.length / 2 && sessions.some((x) => x.dd > 0);
    const useM = !useDist && sessions.some((x) => x.rm > 0);
    const useFt = !useDist && !useM && sessions.some((x) => x.ft > 0);
    for (const x of sessions) { totalMin += x.m; totalDist += x.dd; longest = Math.max(longest, x.m); const y = useDist ? x.dd : useM ? x.rm : useFt ? x.ft : x.m; if (y > 0) pts.push({ x: x.x, y }); }
    const last = sessions[sessions.length - 1];
    ex += picker() + `
      <div class="stats"><div class="stat"><b>${fmtNum(last.m)}</b><span>Last min</span></div><div class="stat"><b>${fmtNum(longest)}</b><span>Longest min</span></div><div class="stat"><b>${fmtNum(totalDist)}</b><span>Total ${DU()}</span></div><div class="stat"><b>${sessions.length}</b><span>Sessions</span></div></div>
      <div class="label">${useDist ? "Distance per session (" + DU() + ")" : useM ? "Meters rowed per session" : useFt ? "Feet climbed per session" : "Minutes per session"}</div>
      ${chart(pts, useDist ? DU() : useM ? "m" : useFt ? "ft" : "min")}`;
  } else {
    const pts = []; let best = null, est = 0;
    for (const [, w] of [...finished()].reverse()) {
      const u = w.unit || "lb"; let top = null;
      for (const e of w.exercises) if (exKey(e.name) === sel) for (const s of e.sets) if (s.done && s.w !== "") {
        const v = conv(s.w, u, U()); if (top == null || v > top) top = v;
        if (s.r) est = Math.max(est, v * (1 + Number(s.r) / 30));
      }
      if (top != null) { pts.push({ x: new Date(w.startedAt), y: top }); if (best == null || top > best) best = top; }
    }
    ex += picker() + `
      <div class="stats"><div class="stat"><b>${fmtNum(best)}</b><span>Best ${U()}</span></div><div class="stat"><b>${fmtNum(pts[pts.length - 1].y)}</b><span>Last ${U()}</span></div><div class="stat"><b>${fmtNum(round(est, 1))}</b><span>Est. 1-rep max</span></div><div class="stat"><b>${pts.length}</b><span>Sessions</span></div></div>
      ${chart(pts, U())}`;
  }
  ex += `</section>`;
  const settings = `<section class="card"><h3>Settings</h3>
    <div class="row between"><span>Units</span><span class="seg"><button data-act="unit" data-u="lb" class="${U() === "lb" ? "on" : ""}">lb · mi</button><button data-act="unit" data-u="kg" class="${U() === "kg" ? "on" : ""}">kg · km</button></span></div>
    <div class="row between"><span>Rest timer after each set</span><span class="seg">${[60, 90, 120, 180].map((s) => `<button data-act="rest-len" data-v="${s}" class="${S.profile.rest === s ? "on" : ""}">${s < 120 ? s + "s" : s / 60 + "m"}</button>`).join("")}</span></div>
    <div class="muted small">${S.mode === "cloud" ? "Your log is saved to your Goal Log Google Sheet, so it's the same on your phone and your computer." : "Goal Log isn't connected to its Google Sheet yet, so this log is saved in this browser only."}</div>
  </section>`;
  return bodyweightCard(false) + ex + settings + importCard() + logCard();
}

    case "add-set": {
      const sets = w.exercises[d.e].sets, p = sets[sets.length - 1];
      sets.push(isCardio(w.exercises[d.e]) ? (machine(w.exercises[d.e].name) ? { ...Object.fromEntries(MFIELDS[machine(w.exercises[d.e].name)].map(([k]) => [k, p && has(p[k]) ? p[k] : ""])), done: false } : { min: p ? p.min : "", dist: p ? p.dist : "", done: false }) : { w: p ? p.w : "", r: p ? p.r : "", done: false }); store.save(wid); render(); break;
    }
    case "rm-set": w.exercises[d.e].sets.pop(); store.save(wid); render(); break;
    case "rm-ex": w.exercises.splice(Number(d.e), 1); store.save(wid); render(); break;
    case "finish": {
      const st = workoutStats(w);
      if (!st.done) { toast("Check off at least one set, or discard this workout."); break; }
      w.finishedAt = w.past ? new Date(new Date(w.startedAt).getTime() + (Number(w.dur) || 60) * 60000).toISOString() : new Date().toISOString(); S.rest = null; tickRest();
      store.save(wid); toast("Saved: " + [st.strength ? `${Math.round(st.vol).toLocaleString()} ${U()} lifted` : "", st.cardio ? `${fmtNum(st.cmin)} min cardio` : ""].filter(Boolean).join(", ") + ".");
      render(); window.scrollTo(0, 0); break;
    }
    case "discard": S.rest = null; tickRest(); store.remove(wid); render(); break;
    case "save-routine": {
      if (!w.exercises.length) { toast("Add an exercise first."); break; }
      const name = w.name.trim() || "My routine";
      const r = { id: "r-" + rid(), name, exercises: w.exercises.map((e) => isCardio(e) ? { name: e.name, type: "cardio", sets: e.sets.length, r: e.sets[0] ? e.sets[0].min : "" } : { name: e.name, sets: e.sets.length, r: e.sets[0] ? e.sets[0].r : "" }) };
      const i = S.profile.routines.findIndex((x) => x.name.toLowerCase() === name.toLowerCase());
      if (i >= 0) { r.id = S.profile.routines[i].id; S.profile.routines[i] = r; } else S.profile.routines.push(r);
      store.save("profile"); toast(i >= 0 ? `Updated routine "${name}".` : `Saved routine "${name}".`); break;
    }
    case "rm-routine": S.profile.routines = S.profile.routines.filter((r) => r.id !== d.id); store.save("profile"); render(); break;
    case "hist-open": S.open = S.open === d.id ? null : d.id; render(); break;
    case "hist-del": store.remove(d.id); S.open = null; render(); break;
    case "resume": {
      if (A) { toast("Finish or discard your current workout first."); break; }
      const rw = S.workouts[d.id]; if (!rw) break;
      rw.finishedAt = null; store.save(d.id); S.open = null; S.tab = "workout"; ls.set("liftlog-tab", "workout");
      toast(`Reopened ${rw.name}`); render(); window.scrollTo(0, 0); break;
    }
    case "repeat": {
      if (A) { toast("Finish or discard your current workout first."); break; }
      const src = S.workouts[d.id];
      newWorkout(src.name, src.exercises.map((e) => isCardio(e) ? { name: e.name, type: "cardio", sets: setsFor(e.name, e.sets.length || 1, e.sets[0] && e.sets[0].min, "cardio") } : { name: e.name, sets: setsFor(e.name, e.sets.length || 3, e.sets[0] && e.sets[0].r) }));
      break;
    }
    case "bw-del": S.profile.bodyweight = S.profile.bodyweight.filter((e) => e.d !== d.d); store.save("profile"); render(); break;
    case "unit": S.profile.unit = d.u; store.save("profile"); render(); break;
    case "rest-len": S.profile.rest = Number(d.v); store.save("profile"); render(); break;
    case "rest-add": if (S.rest) { S.rest.end = Math.max(S.rest.end, Date.now()) + 30000; S.rest.buzzed = false; tickRest(); } break;
    case "add-type": S.addType = d.v; render(); break;
    case "diet-nav": { const dt = parseDay(S.dietDay || dayKey()); dt.setDate(dt.getDate() + Number(d.v)); const k = dayKey(dt); S.dietDay = k >= dayKey() ? null : k; render(); break; }
    case "diet-go": S.dietDay = d.k >= dayKey() ? null : d.k; render(); break;
    case "diet-add": {
      const f = allFoods().find((x) => x.id === d.f); if (!f) break;
      const [id, doc] = dietDoc(S.dietDay || dayKey(), true);
      const it = doc.items.find((x) => x.fid === f.id);
      if (it) it.qty += 1; else doc.items.push(foodItem(f, 1));
      store.save(id, 400); toast(`Added ${f.name} (${Math.round(f.kcal)} cal)`); render(); break;
    }
    case "meal-add": {
      const m = MEALS.find((x) => x.id === d.id); if (!m) break;
      const [id, doc] = dietDoc(S.dietDay || dayKey(), true);
      for (const [fid, q] of m.items) { const f = FOODS.find((x) => x.id === fid); const it = doc.items.find((x) => x.fid === fid); if (it) it.qty += q; else doc.items.push(foodItem(f, q)); }
      store.save(id, 400); toast(`Added ${m.name}`); render(); break;
    }
    case "water": { const [id, doc] = dietDoc(S.dietDay || dayKey(), true); doc.water = Math.max(0, (doc.water || 0) + Number(d.v)); store.save(id, 400); render(); break; }
    case "review": runReview(S.dietDay || dayKey()); break;
    case "recap-hide": ls.set("liftlog-recap-hide", d.k); render(); break;
    case "est-stop": if (estCtl) estCtl.abort(); break;
    case "est-clear-photo": estFile = null; if (estUrl) URL.revokeObjectURL(estUrl); estUrl = null; render(); break;
    case "est-qty": if (S.est && S.est.r) { S.est.qty = Math.max(0.5, S.est.qty + Number(d.v)); render(); } break;
    case "est-add": case "est-save": {
      const r = S.est && S.est.r; if (!r) break;
      const food = { id: "f-" + rid(), name: r.name, serv: r.serv, kcal: r.kcal, p: r.p, c: r.c, f: r.f, fib: r.fib, ca: r.ca, vd: r.vd, g: r.g };
      if (act === "est-save") { S.profile.foods.push(food); store.save("profile"); toast(`Saved ${r.name} to Quick add`); break; }
      const [id, doc] = dietDoc(S.dietDay || dayKey(), true);
      doc.items.push({ ...foodItem(food, S.est.qty), fid: "est-" + rid() });
      store.save(id, 400); toast(`Added ${r.name} (${Math.round(r.kcal * S.est.qty)} cal)`);
      S.est = null; estFile = null; if (estUrl) URL.revokeObjectURL(estUrl); estUrl = null; render(); break;
    }
    case "diet-qty": {
      const [id, doc] = dietDoc(S.dietDay || dayKey()); if (!doc) break;
      const it = doc.items[d.i]; if (!it) break;
      it.qty += Number(d.v); if (it.qty <= 0) doc.items.splice(Number(d.i), 1);
      store.save(id, 400); render(); break;
    }
    case "sm-mode": S.smode = d.v; render(); break;
    case "sm-edit": S.smEdit = !S.smEdit; render(); break;
    case "sm-toggle": {
      if ((S.smode || "make") === "shop") { const sh = S.profile.shop; S.profile.shop = sh.includes(d.id) ? sh.filter((x) => x !== d.id) : [...sh, d.id]; store.save("profile"); }
      else { const [id, doc] = dietDoc(S.dietDay || dayKey(), true); const c = doc.smoothie || []; doc.smoothie = c.includes(d.id) ? c.filter((x) => x !== d.id) : [...c, d.id]; store.save(id, 400); }
      render(); break;
    }
    case "sm-log": {
      const [id, doc] = dietDoc(S.dietDay || dayKey(), true);
      const sf = smoothieFood(); const it = doc.items.find((x) => x.fid === "smoothie");
      if (it) Object.assign(it, foodItem(sf, it.qty + 1)); else doc.items.push(foodItem(sf, 1));
      doc.smoothie = smoothieItems().map((i) => i.id);
      store.save(id, 400); toast(`Smoothie logged with all ${sf.ing.length} ingredients`); render(); break;
    }
    case "sm-clear": S.profile.shop = []; store.save("profile"); render(); break;
    case "sm-rm": S.profile.smoothie = smoothieItems().filter((i) => i.id !== d.id); S.profile.shop = S.profile.shop.filter((x) => x !== d.id); store.save("profile"); render(); break;
    case "rm-food": S.profile.foods = S.profile.foods.filter((f) => f.id !== d.id); store.save("profile"); render(); break;
    case "cal-nav": { const c = S.cal, t = new Date(c.y, c.m + Number(d.v), 1); S.cal = { y: t.getFullYear(), m: t.getMonth() }; S.calDay = null; render(); break; }
    case "cal-day": S.calDay = S.calDay === d.k ? null : d.k; render(); break;
    case "plan-day": {
      const v = Number(d.v), pl = S.profile.plan;
      S.profile.plan = pl.includes(v) ? pl.filter((x) => x !== v) : [...pl, v].sort();
      if (!S.profile.planSince) { const f = finished(); S.profile.planSince = f.length ? dayKey(new Date(f[f.length - 1][1].startedAt)) : dayKey(); }
      store.save("profile"); render(); break;
    }
    case "tmr-open": TM.open = !TM.open; renderTimer(); break;
    case "tmr-close": TM.open = false; renderTimer(); break;
    case "tmr-set": TM.dur = Number(d.v); TM.left = null; saveTM(); renderTimer(); break;
    case "tmr-start": unlockAudio(); TM.end = Date.now() + (TM.left != null ? TM.left : TM.dur) * 1000; TM.left = null; saveTM(); keepAwake(true); renderTimer(); break;
    case "tmr-pause": TM.left = tmLeft(); TM.end = null; saveTM(); keepAwake(false); renderTimer(); break;
    case "tmr-reset": TM.end = null; TM.left = null; saveTM(); keepAwake(false); renderTimer(); break;
    case "tmr-stop": stopAlarm(); break;
    case "tmr-again": stopAlarm(); unlockAudio(); TM.end = Date.now() + TM.dur * 1000; saveTM(); keepAwake(true); renderTimer(); break;
    case "rest-stop": S.rest = null; tickRest(); break;
  }
});

document.addEventListener("change", (ev) => {
  LAST_ACT = "picked " + (ev.target.id || "a file");
  if (ev.target.id && ev.target.id.startsWith("stair-photo-")) { const fs = [...(ev.target.files || [])]; ev.target.value = ""; if (fs.length) readStairPhoto(Number(ev.target.dataset.e), fs); return; }
  if (ev.target.id === "import-file") { const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (f) runImport(f); return; }
  if (ev.target.id !== "est-photo") return;
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  estFile = file; if (estUrl) URL.revokeObjectURL(estUrl); estUrl = URL.createObjectURL(file); render();
});
document.addEventListener("input", (ev) => {
  const el = ev.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === "progex") { S.progEx = el.value; render(); return; }
  const A = active(); if (!A) return;
  const [wid, w] = A;
  if (k === "name") { w.name = el.value; store.save(wid, 700); return; }
  if (k === "wdate") {
    if (!el.value) return;
    const day = parseDay(el.value), today = dayKey();
    if (el.value >= today) { w.past = false; delete w.dur; w.startedAt = w.realStart || new Date().toISOString(); }
    else { if (!w.past) w.realStart = w.startedAt; w.past = true; day.setHours(17, 0, 0, 0); w.startedAt = day.toISOString(); }
    store.save(wid); render(); return;
  }
  if (k === "wdur") { w.dur = parseInt(el.value, 10) || ""; store.save(wid, 700); return; }
  const s = w.exercises[el.dataset.e].sets[el.dataset.s];
  s[k] = el.value.trim() === "" ? "" : (k === "r" ? parseInt(el.value, 10) || "" : fieldVal(k, el.value));
  store.save(wid, 700);
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target.dataset.form;
  if (f === "bw") {
    const v = num($("bw-in").value);
    if (v === "" || v <= 0) { toast("Enter your weight as a number, like 182.5"); return; }
    const today = dayKey();
    S.profile.bodyweight = S.profile.bodyweight.filter((e) => e.d !== today).concat([{ d: today, v, u: U() }]);
    store.save("profile"); toast(`Logged ${fmtNum(v)} ${U()} for today.`); $("bw-in").blur(); render();
  } else if (f === "tmr") {
    const m = num($("tmr-min").value); if (!(m > 0) || m > 600) { toast("Enter minutes, like 10 or 2.5"); return; }
    TM.dur = Math.round(m * 60); TM.left = null; saveTM(); renderTimer();
  } else if (f === "est") {
    runEstimate();
  } else if (f === "sm-add") {
    const name = $("sm-in").value.trim(); if (!name) return;
    S.profile.smoothie = [...smoothieItems(), { id: "i" + rid(), name, sec: "Added by you" }];
    store.save("profile"); $("sm-in").value = ""; render();
  } else if (f === "food") {
    const name = $("ff-name").value.trim(), kcal = num($("ff-kcal").value);
    if (!name || kcal === "") { toast("Add at least a name and calories."); return; }
    S.profile.foods.push({ id: "f-" + rid(), name, serv: $("ff-serv").value.trim() || "1 serving", kcal, p: num($("ff-p").value) || 0, c: num($("ff-c").value) || 0, f: num($("ff-f").value) || 0, g: $("ff-g").value });
    store.save("profile"); toast(`Saved ${name}. It's in Quick add now.`); render();
  } else if (f === "goals") {
    const kcal = parseInt($("g-kcal").value, 10), protein = parseInt($("g-p").value, 10);
    if (!(kcal > 0) || !(protein > 0)) { toast("Enter whole numbers for both goals."); return; }
    S.profile.goals = { kcal, protein }; store.save("profile"); toast("Goals saved."); document.activeElement.blur(); render();
  } else if (f === "ex") {
    const A = active(); const name = $("ex-in").value.trim(); if (!A || !name) return;
    const known = [...COMMON, ...CARDIO, ...finished().flatMap(([, w]) => w.exercises.map((e) => e.name))].find((n) => exKey(n) === exKey(name));
    const last = lastSets(name);
    const cardio = last ? last.cardio : (isCardioName(name) || S.addType === "cardio");
    A[1].exercises.push(cardio
      ? { name: known || name, type: "cardio", sets: setsFor(name, last ? last.sets.length : 1, "", "cardio") }
      : { name: known || name, sets: setsFor(name, last ? last.sets.length : 3, last ? null : "") });
    store.save(A[0]); $("ex-in").value = ""; render();
  }
});

render();
renderTimer();
store.init();
</script>
</body>
</html>
